# One PostgreSQL node for the load spike (#3). Durable commits stay on:
# synchronous_commit and fsync are left at their defaults on purpose.
services:
  db:
    image: postgres:17
    container_name: tourist-spike-db
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "55432:5432"
    shm_size: 2g
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=50ms
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_checkpoints=on

volumes:
  pgdata:
